name: Python CI

on:
  push: 
    branches: [ main ]
  pull_request:
    branches:  [ main ]

jobs:
  test:
    runs-on:  ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version:  ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run unit tests
      run: |
        xvfb-run -a pytest register_test.py -v --tb=short
    
    - name: Run integration tests
      run: |
        xvfb-run -a pytest test_integration.py -v --tb=short
    
    - name: Run bill management tests
      run: |
        xvfb-run -a pytest test_bill_management. py -v --tb=short
    
    - name: Generate coverage report
      run: |
        xvfb-run -a pytest --cov=main18 --cov-report=xml --cov-report=term
